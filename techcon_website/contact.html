<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Contact Us | TechCon 2024</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
      }
      header,
      footer {
        background: #222;
        color: #fff;
        padding: 20px 0;
        text-align: center;
      }
      nav a {
        color: #fff;
        margin: 0 15px;
        text-decoration: none;
      }
      nav a:hover {
        text-decoration: underline;
      }
      main {
        max-width: 800px;
        margin: 30px auto;
        padding: 0 20px;
      }
      .contact-info {
        margin-bottom: 30px;
      }
      .contact-info a {
        color: #0073e6;
        text-decoration: none;
      }
      .contact-info a:hover {
        text-decoration: underline;
      }
      .social-links a {
        margin-right: 15px;
      }
      .map-responsive {
        overflow: hidden;
        padding-bottom: 56.25%;
        position: relative;
        height: 0;
        margin-bottom: 30px;
      }
      .map-responsive iframe {
        left: 0;
        top: 0;
        height: 100%;
        width: 100%;
        position: absolute;
        border: 0;
      }
      form {
        background: #f9f9f9;
        padding: 20px;
        border-radius: 8px;
      }
      label {
        display: block;
        margin-top: 15px;
      }
      input,
      textarea {
        width: 100%;
        padding: 8px;
        margin-top: 5px;
        border: 1px solid #ccc;
        border-radius: 4px;
      }
      button {
        margin-top: 15px;
        padding: 10px 20px;
        background: #0073e6;
        color: #fff;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }
      button:hover {
        background: #005bb5;
      }
      @media (max-width: 600px) {
        main {
          padding: 0 10px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Contact Us</h1>
      <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="schedule.html">Schedule</a>
        <a href="register.html">Register</a>
      </nav>
    </header>
    <main>
      <section class="contact-info">
        <h2>Get in Touch</h2>
        <p>
          <strong>Email:</strong>
          <a href="mailto:email@example.com">email@example.com</a>
        </p>
        <div class="social-links">
          <strong>Follow us:</strong>
          <a href="https://twitter.com/" target="_blank" aria-label="Twitter"
            >Twitter</a
          >
          <a href="https://facebook.com/" target="_blank" aria-label="Facebook"
            >Facebook</a
          >
          <a href="https://linkedin.com/" target="_blank" aria-label="LinkedIn"
            >LinkedIn</a
          >
        </div>
      </section>
      <section class="map-responsive">
        <iframe
          src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3153.019019688799!2d-122.41941508468137!3d37.7749297797596!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x8085808c7e0aaf0b%3A0x7d0c6e8b1e6f8b8a!2sMoscone%20Center!5e0!3m2!1sen!2sus!4v1700000000000"
          width="600"
          height="450"
          style="border: 0"
          allowfullscreen=""
          loading="lazy"
          referrerpolicy="no-referrer-when-downgrade"
          title="TechCon 2024 Venue Location"
        >
        </iframe>
      </section>
      <section>
        <h2>Contact Us Form</h2>
        <form>
          <label for="name">Name:</label>
          <input type="text" id="name" name="name" required />

          <label for="email">Email:</label>
          <input type="email" id="email" name="email" required />

          <label for="message">Message:</label>
          <textarea id="message" name="message" rows="5" required></textarea>

          <button type="submit">Send Message</button>
        </form>
      </section>
    </main>
    <footer>&copy; 2024 TechCon. All rights reserved.</footer>
  </body>
</html>
